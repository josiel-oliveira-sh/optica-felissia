{% extends "base.html" %}
{% block title %}Recuperar Senha{% endblock %}
{% block content %}
    <div class="app-header">
        <img src="{{ url_for('static', filename='logo_optica.png') }}" alt="Óptica Felíssia" class="app-logo">
        <span class="app-agenda-text">AGENDA</span>
    </div>
    <h2>Recuperar Senha</h2>
    <p>Informe seu número de WhatsApp para receber um código de recuperação.</p>
    <form method="post">
        <div class="form-group">
            <label for="whatsapp">WhatsApp:</label>
            <input type="text" id="whatsapp" name="whatsapp" placeholder="(XX) XXXXX-XXXX" required>
        </div>
        <input type="submit" value="Enviar Código" class="btn-primary">
    </form>
    <p><a href="{{ url_for('login') }}">Voltar para o Login</a></p>
{% endblock %}
