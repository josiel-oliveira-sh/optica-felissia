{% extends "base.html" %}
{% block title %}Agendar Consulta{% endblock %}
{% block content %}
    <div class="app-header">
        <img src="{{ url_for('static', filename='logo_optica.png') }}" alt="Óptica Felíssia" class="app-logo">
        <span class="app-agenda-text">AGENDA</span>
    </div>
    <h2>Agendar Consulta de Vista</h2>

    {% if mensagem %}
        <div class="message">
            <strong>{{ mensagem }}</strong>
        </div>
        
        <!-- Resposta inteligente / IA para o cliente -->
        <div class="resposta-ia">
            <div class="ia-header">
                <span class="ia-icon">🤖</span>
                <span class="ia-label">Resposta Automática</span>
            </div>
            <div class="ia-mensagem">
                <p>{{ resposta_ia }}</p>
            </div>
        </div>
        
        <script>
            // Abrir diretamente o WhatsApp da óptica com os dados do cliente
            setTimeout(() => {
                window.open("{{ whatsapp_oticia_url }}", '_blank');
            }, 1000);
        </script>
    {% endif %}

    <div id="agendamento-form" style="display: {% if mensagem %}none{% else %}block{% endif %};">
        <form method="post">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required oninput="mascaraCPF(this)">
            </div>
            
            <div class="form-group">
                <label for="endereco">Rua/Logradouro:</label>
                <input type="text" id="endereco" name="endereco" required>
            </div>

            <div class="form-group">
                <label for="numero">Número:</label>
                <input type="text" id="numero" name="numero" required>
            </div>

            <div class="form-group">
                <label for="referencia">Ponto de Referência:</label>
                <input type="text" id="referencia" name="referencia" placeholder="Ex: Próximo ao mercado">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone/WhatsApp:</label>
                <input type="text" id="telefone" name="telefone" placeholder="(98) 9XXXX-XXXX" required>
            </div>

            <div class="form-group">
                <label for="data">Data da Consulta:</label>
                <input type="date" id="data" name="data" required>
            </div>

            <div class="form-group">
                <label for="horario">Melhor Horário:</label>
                <select id="horario" name="horario" required>
                    {% for h in horarios %}
                        <option value="{{ h }}">{{ h }}</option>
                    {% endfor %}
                </select>
            </div>

            <input type="submit" value="CONFIRMAR AGENDAMENTO" class="btn-primary">
        </form>
    </div>

    <script>
        function mascaraCPF(input) {
            let v = input.value.replace(/\D/g, '');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            input.value = v;
        }
    </script>

    <!-- SISTEMA DE JOINHA / AVALIAÇÃO -->
    <div class="joinha-section">
        <p class="joinha-pergunta">O que achou do nosso app?</p>
        <div class="joinha-container">
            <button class="joinha-btn joinha-positivo" onclick="enviarJoinha('positivo')">
                <span class="joinha-emoji">&#128077;</span>
                <span class="joinha-texto">Gostei!</span>
            </button>
            <button class="joinha-btn joinha-negativo" onclick="enviarJoinha('negativo')">
                <span class="joinha-emoji">&#128078;</span>
                <span class="joinha-texto">Não gostei</span>
            </button>
        </div>
        <div class="joinha-feedback" id="joinha-feedback" style="display: none;">
            <span></span>
        </div>
        <div class="joinha-stats" id="joinha-stats"></div>
    </div>

    <script>
        function enviarJoinha(tipo) {
            fetch('/joinha', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ tipo: tipo })
            })
            .then(response => response.json())
            .then(data => {
                if (data.sucesso) {
                    const feedback = document.getElementById('joinha-feedback');
                    feedback.style.display = 'block';
                    if (tipo === 'positivo') {
                        feedback.innerHTML = '<span>👍 Obrigado pela sua avaliação positiva!</span>';
                    } else {
                        feedback.innerHTML = '<span>😔 Lamentamos! Vamos melhorar o app!</span>';
                    }
                    
                    const stats = document.getElementById('joinha-stats');
                    stats.innerHTML = `Avaliações: 👍 ${data.positivos} | 👎 ${data.negativos}`;
                    
                    document.querySelectorAll('.joinha-btn').forEach(btn => {
                        btn.classList.add('disabled');
                        btn.disabled = true;
                    });
                    
                    setTimeout(() => {
                        feedback.style.display = 'none';
                    }, 3000);
                }
            })
            .catch(error => {
                console.error('Erro ao enviar avaliação:', error);
            });
        }

        // Carregar estatísticas iniciais
        fetch('/joinha_stats')
            .then(response => response.json())
            .then(data => {
                if (data.voto_hoje) {
                    document.querySelectorAll('.joinha-btn').forEach(btn => {
                        btn.classList.add('disabled');
                        btn.disabled = true;
                    });
                }
                const stats = document.getElementById('joinha-stats');
                if (stats && (data.positivos > 0 || data.negativos > 0)) {
                    stats.innerHTML = `Avaliações: 👍 ${data.positivos} | 👎 ${data.negativos}`;
                }
            })
            .catch(error => {
                console.log('Stats carregados');
            });
    </script>

    <p style="margin-top: 20px;"><a href="{{ url_for('home') }}">Voltar para o Dashboard</a></p>
    <p><a href="{{ url_for('logout') }}">Sair</a></p>
{% endblock %}
